<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Registro de usuario
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <!-- 🧾 CARD -->
            <div class="card shadow border-0">

                <div class="card-header bg-dark text-white text-center">

                    <h3 class="mb-0">
                        👤 Crear usuario
                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <!-- 👤 USUARIO -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Usuario
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="usuario"
                                required
                            >

                        </div>

                        <!-- 🔒 PASSWORD -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                name="password"
                                required
                            >

                        </div>

                        <!-- 🛡️ ROL -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Rol
                            </label>

                            <select
                                name="rol"
                                class="form-select"
                                required
                            >

                                <option value="admin">
                                    👑 Administrador
                                </option>

                                <option value="tecnico">
                                    🔧 Técnico
                                </option>

                                <option value="operador">
                                    👀 Operador
                                </option>

                            </select>

                        </div>

                        <!-- 🔘 BOTONES -->
                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Registrar
                            </button>

                            <a
                                href="/login"
                                class="btn btn-secondary w-100"
                            >
                                Volver
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
